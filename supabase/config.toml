project_id = "lanita"

[api]
enabled = true
port = 54321
schemas = ["public"]          # el esquema `app` NO se expone
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false                      # los usuarios los crea el admin
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 10
token_refresh = 150
token_verifications = 30

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"
